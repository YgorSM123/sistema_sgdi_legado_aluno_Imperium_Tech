{% extends "base.html" %}

{% block content %}
<h2>Editar Demanda</h2>

<form method="POST" action="/editar/{{ demanda[0] }}">
    <div>
        <label>Titulo:</label><br>
        <input type="text" name="titulo" value="{{ demanda[1] }}" size="50">
    </div>
    <br>

    <div>
        <label>Descricao:</label><br>
        <textarea name="descricao" rows="5" cols="50">{{ demanda[2] }}</textarea>
    </div>
    <br>

    <div>
        <label>Solicitante:</label><br>
        <input type="text" name="solicitante" value="{{ demanda[3] }}">
    </div>
    <br>

    <div>
        <label>Prioridade:</label><br>
        <select name="prioridade">
            <option value="alta" {% if demanda[5] == 'alta' %}selected{% endif %}>Alta</option>
            <option value="media" {% if demanda[5] == 'media' %}selected{% endif %}>Media</option>
            <option value="baixa" {% if demanda[5] == 'baixa' %}selected{% endif %}>Baixa</option>
        </select>
    </div>
    <br>

    <div>
        <label>Data de Criacao:</label><br>
        <input type="text" value="{{ demanda[4] }}" disabled>
    </div>
    <br>

    <div>
        <label>Status:</label><br>
        <input type="text" value="{{ demanda[6] }}" disabled>
    </div>
    <br>

    <button type="submit">Atualizar</button>
    <a href="/"><button type="button">Cancelar</button></a>
</form>

{% endblock %}
